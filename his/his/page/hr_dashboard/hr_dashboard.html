<div class="fd-hr">
	<div class="fd-hr-header">
		<div class="fd-date-filters">
			<div class="fd-filter-card fd-from-date"></div>
			<div class="fd-date-separator"></div>
			<div class="fd-filter-card fd-to-date"></div>
			<div class="fd-filter-card fd-department-filter"></div>
		</div>
		<h2>HRM and Payroll</h2>
		<div class="fd-header-mark"></div>
	</div>

	<div class="fd-hr-kpis"></div>

	<div class="fd-hr-grid">
		<section class="fd-section fd-department-panel">
			<h3>No. Employee and Salary by Department</h3>
			<div class="fd-department-bars"></div>
		</section>

		<section class="fd-section fd-salary-panel">
			<div class="fd-trend-grid">
				<div class="fd-trend-cell">
					<h3>Salary Trend</h3>
					<div id="fd-hr-salary-chart" class="fd-hr-chart"></div>
				</div>
				<div class="fd-trend-cell">
					<h3>Commission Trend</h3>
					<div id="fd-hr-commission-chart" class="fd-hr-chart"></div>
				</div>
			</div>
		</section>

		<section class="fd-section fd-advance-panel">
			<h3>Employee Advance and Receivables</h3>
			<div class="fd-table-wrap fd-advance-table"></div>
		</section>

		<section class="fd-section fd-expense-panel">
			<div class="fd-expense-grid">
				<div class="fd-expense-chart-cell">
					<h3>Employee Exit Trend</h3>
					<div id="fd-employee-exit-chart" class="fd-hr-chart fd-exit-chart"></div>
				</div>
				<div class="fd-expense-table-cell">
					<h3>Employee Expense by Department</h3>
					<div class="fd-table-wrap fd-expense-table"></div>
				</div>
			</div>
		</section>

		<section class="fd-section fd-leave-panel">
			<h3>Leaves</h3>
			<div class="fd-table-wrap fd-leave-table"></div>
		</section>
	</div>
</div>
